name: Build REG-linux QT6 self-hosted

on:
  workflow_dispatch:

concurrency:
    group: ${{ github.repository }}-${{ github.workflow }}
    cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    name: Build REG-linux QT6
    runs-on: self-hosted
    strategy:
      matrix:
        # One leg per CPU, not per board: reglinux-qt6.mk picks the prebuilt by
        # CPU (REGLINUX_QT6_CPU), so the target named here is just a
        # representative board and every other board sharing that CPU takes the
        # same tarball. Keep this list in step with the table in
        # REG-WIP/scripts/linux/prebuild/prebuild-qt6.sh.
        #
        # Picking a representative board is not arbitrary: the tarball inherits that
        # board's ISA, toolchain and XORG7 state, and every board sharing the CPU label
        # has to be able to load and execute the result. In priority order:
        #
        #   ISA dominates. An optional extension compiled in is an unconditional SIGILL
        #   on a board without it. On RISC-V, k1 and k3 set BR2_RISCV_ISA_RVV
        #   (-march=rv64imafdcv...) while jh7110 (sifive-u74) and th1520 (xt-c910) do
        #   not, so a k1/k3-built tarball cannot run on jh7110/th1520. The reverse is
        #   fine: base rv64gc code runs everywhere.
        #
        #   Toolchain next. Qt carries versioned GLIBCXX_3.4.xx requirements and
        #   libstdc++ is only backward compatible, so build with the OLDEST GCC in the
        #   group (riscv: jh7110/k3 are gcc15, k1/th1520 gcc16).
        #
        #   XORG7 last (from BR2_PACKAGE_REGLINUX_XWAYLAND, per board, not from
        #   reglinux-board.common). With it on, libQt6Gui.so itself links libX11 - not
        #   just libqxcb.so - so a board without libX11 cannot start ANY Qt app. Fatal,
        #   not a skipped plugin. With it off the X boards merely lose the XCB platform
        #   plugin and keep working under Wayland.
        #
        # riscv is the one group where no single board wins all three: the non-RVV
        # boards (jh7110, th1520) both have XWAYLAND, and the boards without it (k1,
        # k3) are RVV. ISA outranks the rest, so jh7110 stays - do NOT swap it for k3.
        # The real fix, if a riscv board ever pulls reglinux-qt6, is to split the label
        # the way reglinux-scummvm already does (riscv = jh7110/th1520, riscv_rvv =
        # k1/k3), not to change the representative. Today nothing forces it: 7 of the 8
        # consumers of reglinux-qt6 are gated to explicit x86_64/aarch64 SoC targets and
        # the 8th (snes9x) needs BR2_PACKAGE_HAS_LIBGL, which those boards' GLES-only
        # Imagination stack does not provide - verify that before relying on it.
        # cortex_a35 and cortex_a55 are mixed only in XORG7, already the safe way round.
        #
        #   XORG7 (from BR2_PACKAGE_REGLINUX_XWAYLAND, per board, not from
        #   reglinux-board.common) decides whether qt6base builds with FEATURE_xcb.
        #   With it on, libQt6Gui.so itself links libX11 - not just libqxcb.so - so a
        #   board without libX11 cannot start ANY Qt app. This is fatal, not a skipped
        #   plugin. With it off the X boards merely lose the XCB platform plugin and
        #   keep working under Wayland.
        #
        #   The toolchain cuts the other way: Qt carries versioned GLIBCXX_3.4.xx
        #   requirements, and libstdc++ is only backward compatible, so a tarball built
        #   with a newer GCC will not load on a board pinned to an older one.
        #
        # So the representative must be the LOWEST common denominator of its CPU group:
        # oldest toolchain, and XORG7 off. riscv is the one mixed group - jh7110
        # (gcc15, X) k3 (gcc15, no X) k1 (gcc16, no X) th1520 (gcc16, X) - where k3 is
        # the correct pick and jh7110, the current one, is not. Left alone because no
        # riscv board appears to pull reglinux-qt6 at all: 7 of its 8 consumers are
        # gated to explicit x86_64/aarch64 SoC targets and the 8th (snes9x) needs
        # BR2_PACKAGE_HAS_LIBGL, which those boards' GLES-only Imagination stack does
        # not provide. Verify that before relying on it. cortex_a35 and cortex_a55 are
        # mixed only in XORG7, and already the safe way round.
        #
        # The 32-bit CPUs reglinux-qt6.mk also maps (arm1176jzf_s, cortex_a7,
        # cortex_a9, cortex_a15_a7, xburst) are absent on purpose: every package
        # that selects BR2_PACKAGE_REGLINUX_QT6 is gated on BR2_ARCH_IS_64 /
        # BR2_aarch64 / x86_64 in Config.in.emulators, so those boards never
        # look for a tarball.
        cpu: [cortex_a17, cortex_a35, cortex_a53, cortex_a55, cortex_a72, cortex_a72_a53, cortex_a73_a53, cortex_a75_a55, cortex_a76, cortex_a76_a55, riscv, x86_64, x86_64_v3, saphira]
        include:
          - target: rk3288
            cpu: cortex_a17
          - target: rk3326
            cpu: cortex_a35
          - target: h616
            cpu: cortex_a53
          - target: rk3568
            cpu: cortex_a55
          - target: bcm2711
            cpu: cortex_a72
          - target: rk3399
            cpu: cortex_a72_a53
          - target: s922x
            cpu: cortex_a73_a53
          - target: sdm845
            cpu: cortex_a75_a55
          - target: bcm2712
            cpu: cortex_a76
          - target: sm8250
            cpu: cortex_a76_a55
          - target: jh7110
            cpu: riscv
          - target: x86_64
            cpu: x86_64
          - target: x86_64_v3
            cpu: x86_64_v3
          - target: asahi
            cpu: saphira
      fail-fast: false
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Clone repository
        id: clone_step
        uses: actions/checkout@v7.0.1
        with:
          repository: REG-Linux/REG-WIP
          token: ${{ secrets.REG_TOKEN }}
          submodules: true

      - name: Compile ${{ matrix.target }}
        id: compile_step
        env:
          GH_TOKEN: ${{ secrets.REG_TOKEN }}
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git config --local user.password ${{ github.token }}
          
          # Merge buildroot patches
          CUSTOM_DIR=${{ github.workspace }}/custom BUILDROOT_DIR=${{ github.workspace }}/buildroot ${{ github.workspace }}/scripts/buildroot/mergeToBR.sh
          
          # Version
          qtversion="$(grep -m 1 QT6_VERSION_MAJOR buildroot/package/qt6/qt6.mk | sed -e 's/.*=[ ]*//')$(grep -m 1 'QT6_VERSION ' buildroot/package/qt6/qt6.mk | sed -e 's/.*)//')"
          echo "qtversion=${qtversion}" >> "$GITHUB_OUTPUT"
          echo "qtversion=${qtversion}"
          
          # Check if already released and avoid compiling again
          if [ "$(curl -o /dev/null -s -Iw '%{http_code}' -L "https://github.com/${{ github.repository }}/releases/download/${qtversion}/reglinux-qt6-${qtversion}-${{ matrix.cpu }}.tar.xz")" -eq 200 ]; then
            echo "Already released, skipping build."
          else
            echo "Not yet released, proceeding with build"
            df -BG --output=avail ./
            
            # Patch Makefile to use 'reglinux-build:latest' docker image from ghcr.io
            sed -i '/^DOCKER_REPO/ s|reglinux|ghcr.io/reg-linux|' Makefile
            sed -i '/ build . -t /d' Makefile
            # fix for error "failed to set up container networking"
            sed -i 's| --rm | --rm --network host |' Makefile
            
            # Disable CCACHE
            sed -i "/BR2_CCACHE/d" configs/reglinux-board.common
            
            # The download cleanup the hosted workflow does (see
            # ci/scripts/ci-free-space.mk there) is deliberately not done here:
            # a self-hosted runner has the disk, and keeping dl/ makes reruns
            # cheap. Nothing else is needed - sed'ing pkg-generic.mk for the
            # staging directory name is gone too, see the packaging step below.
            
            # Enable the flags to build QT6 from source
            sed -i s/#BR2_PACKAGE_REGLINUX_QT6=y/BR2_PACKAGE_REGLINUX_QT6=y/ configs/reglinux-board.common
            sed -i s/#BR2_PACKAGE_REGLINUX_QT6_BUILD_FROM_SOURCE=y/BR2_PACKAGE_REGLINUX_QT6_BUILD_FROM_SOURCE=y/ configs/reglinux-board.common
            sed -i s/#BR2_PACKAGE_QT6BASE_DEFAULT_QPA=\"wayland\"/BR2_PACKAGE_QT6BASE_DEFAULT_QPA=\"wayland\"/ configs/reglinux-board.common
            
            # No toolchain cache here, unlike the hosted build-QT6.yml.
            # This workflow builds with the default PARALLEL_BUILD=y and
            # the cache tarballs on REG-llvm-binaries are built with PARALLEL_BUILD=n.
            
            # Keep Buildroot's downloads outside the workspace. actions/checkout
            # runs with clean: true, so a workspace dl/ is wiped before every
            # leg and all 14 of them re-download the same tarballs. This also
            # fixes an outright failure: every container mounts
            # -v $(DL_DIR):/build/buildroot/dl, and docker creates a missing
            # bind-mount source as root:root, which the build - running as
            # -u $(id -u):$(id -g) - then cannot write into:
            #   mkdir: cannot create directory '/build/buildroot/dl/m4': Permission denied
            # Export it rather than passing DL_DIR=... on the make command line:
            # DL_DIR is not in the Makefile's WRAPPER_VARS, so a command-line
            # assignment would be forwarded into the container through MAKEFLAGS
            # and point Buildroot at a host path that does not exist there.
            export DL_DIR="${HOME}/reglinux-dl"
            mkdir -p "$DL_DIR"
            
            make ${{ matrix.target }}-clean
            DEBUG_BUILD=n CCACHE_DISABLE=1 make PKG=reglinux-qt6 ${{ matrix.target }}-pkg
            
            # Create package
            # $1 = list to write, $2.. = build dirs owning the files
            collect_filelist() {
              out="$1"; shift
              : > "$out"
              for d in "$@"; do
                [ -d "$d" ] || continue
                # Every manifest line is "<pkgname>,./path", and <pkgname> is
                # also the per-package directory name, so take it from the
                # manifest instead of unpicking "<name>-<version>" out of the
                # build directory (versions contain dashes too).
                pkg=""
                for m in "$d"/.files-list.txt "$d"/.files-list-host.txt "$d"/.files-list-staging.txt; do
                  [ -s "$m" ] || continue
                  pkg="$(head -n 1 "$m" | cut -d ',' -f 1)"
                  break
                done
                # Every manifest empty: the package installed nothing.
                [ -n "$pkg" ] || continue
                if [ "$ppd" = y ]; then
                  hostroot="per-package/$pkg/host"
                  targetroot="per-package/$pkg/target"
                else
                  hostroot="host"
                  targetroot="target"
                fi
                if [ -f "$d/.files-list-host.txt" ]; then
                  cut -d ',' -f 2- "$d/.files-list-host.txt" | sed -e "s+^./+${hostroot}/+" >> "$out"
                fi
                if [ -f "$d/.files-list-staging.txt" ]; then
                  cut -d ',' -f 2- "$d/.files-list-staging.txt" | sed -e "s+^./+${hostroot}/${stagingsub}/+" >> "$out"
                fi
                if [ -f "$d/.files-list.txt" ]; then
                  cut -d ',' -f 2- "$d/.files-list.txt" | sed -e "s+^./+${targetroot}/+" >> "$out"
                fi
              done
              # LC_ALL=C: this workflow sets LC_ALL=en_US.UTF-8, and under a UTF-8
              # locale sort ignores punctuation at the primary collation level, so two
              # real files whose names differ only by punctuation compare equal and -u
              # silently drops one. "LLVM-Config.cmake" swallowed "LLVMConfig.cmake"
              # and "__stdarg___va_copy.h" swallowed "__stdarg_va_copy.h"; the tar below
              # then skipped the missing paths without failing the build.
              LC_ALL=C sort -u -o "$out" "$out"
              echo "$(wc -l < "$out") files in $out"
            }

            cd "${{ github.workspace }}/output/${{ matrix.target }}" || exit 1
            # With PARALLEL_BUILD=y each package installs into its own
            # per-package/<pkg>/{host,target}; output/host and output/target
            # stay empty because host-finalize/target-finalize never run for a
            # `<target>-pkg` goal. Harvest from there and let tar strip the
            # prefix back off, so the tarball keeps the same host/, target/ and
            # <tuple>/sysroot/ layout either way. Keep the non-per-package
            # branch working: reglinux-qt6.mk unpacks both the same.
            if [ -d per-package ]; then
              ppd=y
              hostglob="per-package/*/host"
            else
              ppd=n
              hostglob="host"
            fi
            # STAGING_DIR is $(HOST_DIR)/$(GNU_TARGET_NAME)/sysroot and a host
            # tree holds exactly one tuple directory, so the glob IS the tuple.
            # The sed that used to write this into pkg-generic.mk had to go:
            # that file is owned by custom/package/pkg-generic.mk.patch, and
            # every `make <target>-*` goal depends on the `merge` target, so the
            # next make re-ran mergeToBR.sh over the sed'ed file and aborted
            # with "target file does not have expected MD5 checksum".
            stagingdir="$(printf '%s\n' $hostglob/*/sysroot | head -n 1)"
            if [ ! -d "$stagingdir" ]; then
              echo "No staging directory under output/${{ matrix.target }} - was the toolchain built?"
              exit 1
            fi
            stagingsub="${stagingdir%/sysroot}"
            stagingsub="${stagingsub##*/}/sysroot"
            # reglinux-qt6/Config.in now selects BR2_PACKAGE_QT6MULTIMEDIA_FFMPEG, so
            # qt6multimedia also ships plugins/multimedia/libffmpegmediaplugin.so. Without
            # a backend it built libQt6Multimedia.so and no plugins at all, and every
            # QMediaPlayer failed with "No QtMultimedia backends found" - the harvest was
            # never at fault, there was simply nothing to harvest.
            #
            # That plugin links the board's ffmpeg and pulseaudio (libavcodec.so.61,
            # libpulse.so.0 today). Neither belongs in this tarball - the board supplies
            # both - but it does couple the tarball to REG-WIP's ffmpeg SONAME: bump ffmpeg
            # to a new major and the plugin silently stops loading on every board still
            # using an old tarball. Re-cut these tarballs when ffmpeg's major changes.
            #
            # qt6* / host-qt6* cover every qt6 sub-package (qt6base,
            # qt6declarative, qt6multimedia, qt6shadertools, qt6svg, qt6tools,
            # qt6wayland, qt6websockets and their host counterparts). The
            # reglinux-qt6 wrapper installs nothing of its own, so it is not
            # listed here.
            #
            # The glob is exact because the runner starts from a fresh checkout
            # and only ever builds PKG=reglinux-qt6, so build/ holds precisely
            # REGLINUX_QT6_DEPENDENCIES' closure, and reglinux-qt6/Config.in
            # selects exactly those same eight modules - it used to also select
            # qt6charts, which nothing depended on and no tarball ever shipped.
            collect_filelist qt6-filelist.txt build/qt6* build/host-qt6*
            if [ ! -s qt6-filelist.txt ]; then
              echo "No qt6 manifests found - was QT6 really built from source?"
              exit 1
            fi
            # flags=rh keeps the rewrite to member names and hard-link
            # targets; symlink targets (flag s, on by default) must stay as the
            # package wrote them.
            if [ "$ppd" = y ]; then
              XZ_OPT=-9 tar -cJf "${{ github.workspace }}/reglinux-qt6-${qtversion}-${{ matrix.cpu }}.tar.xz" --transform='flags=rh;s|^per-package/[^/]*/||' --verbatim-files-from -T qt6-filelist.txt || :
            else
              XZ_OPT=-9 tar -cJf "${{ github.workspace }}/reglinux-qt6-${qtversion}-${{ matrix.cpu }}.tar.xz" --verbatim-files-from -T qt6-filelist.txt || :
            fi
            echo "dorelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Artifacts
        if: ${{ steps.compile_step.outputs.dorelease == 'true' && ! cancelled() }}
        id: upload_artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reglinux-qt6-${{ steps.compile_step.outputs.qtversion }}-${{ matrix.cpu }}
          compression-level: 0
          path: reglinux-qt6-${{ steps.compile_step.outputs.qtversion }}-*

      - name: Upload full-build.log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-build-log-${{ matrix.target }}
          path: ${{ github.workspace }}/output/${{ matrix.target }}/build/full-build.log

  create_release:
    name: Create release
    runs-on: self-hosted
    needs: build
    if: ${{ !cancelled() }}
    steps:
      - name: Clean stale artifacts from previous runs
        run: rm -rf artifacts && mkdir -p artifacts

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: reglinux-qt6-*
          path: artifacts
          merge-multiple: true

      # A matrix job cannot aggregate a "did anything build?" flag: all 14 legs
      # write the same job output and the last one to finish wins, so a leg that
      # skipped (its asset is already released) would suppress the release. The
      # artifacts are the aggregate - only legs that built something upload one -
      # and the version is already in their file names.
      - name: Decide whether there is anything to release
        id: rel
        run: |
          shopt -s nullglob
          files=(artifacts/reglinux-qt6-*.tar.xz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No new tarballs were built; nothing to release."
            exit 0
          fi
          qtversion="$(basename "${files[0]}" | sed -nE 's/^reglinux-qt6-([0-9]+(\.[0-9]+)*)-.*\.tar\.xz$/\1/p')"
          if [ -z "$qtversion" ]; then
            echo "Could not parse the QT6 version from ${files[0]}"
            exit 1
          fi
          echo "Releasing ${#files[@]} tarball(s) as ${qtversion}"
          echo "qtversion=${qtversion}" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: ${{ steps.rel.outputs.qtversion != '' }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: artifacts/reglinux-qt6-${{ steps.rel.outputs.qtversion }}-*.tar.xz
          tag_name: ${{ steps.rel.outputs.qtversion }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          name: QT6 binaries ${{ steps.rel.outputs.qtversion }}

      # Keep the release list bounded: the three newest of each family this
      # workflow publishes, older ones deleted along with their tags (the same
      # --cleanup-tag idiom the toolchain cache already uses).
      #
      # The filter is an ALLOWLIST of the tags this workflow itself creates,
      # never a denylist. toolchain-<cpu> caches, hand-made releases and older
      # naming schemes cannot match these patterns, so they are never at risk.
      # Pruning is scoped to the families actually released in this run.
      - name: Prune old releases
        if: ${{ steps.rel.outputs.qtversion != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::gh is not installed on this runner; skipping release pruning"
            exit 0
          fi
          KEEP=3
          prune() {
            pattern="$1"
            echo "== keeping the ${KEEP} newest releases matching ${pattern}"
            # Newest first, restrict to this family, then drop the first KEEP.
            # grep is allowed to match nothing, hence the || true.
            doomed="$(gh release list --limit 200 --json tagName,createdAt \
                        --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
                      | grep -E "${pattern}" | tail -n +$((KEEP + 1)) || true)"
            if [ -z "${doomed}" ]; then
              echo "   nothing to remove"
              return 0
            fi
            printf '%s\n' "${doomed}" | while read -r tag; do
              [ -n "${tag}" ] || continue
              echo "   deleting ${tag}"
              gh release delete "${tag}" --cleanup-tag --yes \
                || echo "::warning::could not delete release ${tag}"
            done
          }
          prune '^[0-9]+(\.[0-9]+)+$'
